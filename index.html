<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Star 5 TV - Régie Mobile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --gn-red: #CE1126;
            --gn-yellow: #FCD116;
            --gn-green: #009639;
            --bg-main: #0b0d11;
            --bg-card: #151821;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: #ffffff;
            padding: 10px;
        }

        /* HEADER AVEC LOGO GUINÉE */
        header {
            background: #11141c;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--gn-yellow);
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-title h1 {
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .brand-title span {
            font-size: 0.65rem;
            color: var(--gn-yellow);
            font-weight: bold;
        }

        /* ÉCRAN TÉLÉVISION */
        .tv-screen-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #232733;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        video {
            display: none;
        }

        /* PANNEAU DE CONTRÔLE */
        .studio-panel {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 15px;
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-main {
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            color: white;
        }

        .btn-start { background: var(--gn-green); }
        .btn-cam { background: #3b82f6; }
        .btn-rec { background: var(--gn-red); }

        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #0b0d11;
            border: 1px solid #33394a;
            color: white;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        /* REPLAYS */
        .replays-list {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .replay-item {
            background: var(--bg-card);
            padding: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--gn-green);
        }

        .replay-item a {
            color: var(--gn-yellow);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- ENTÊTE -->
    <header>
        <div class="brand-box">
            <!-- Logo Star 5 TV Guinée -->
            <svg width="35" height="35" viewBox="0 0 100 100">
                <defs>
                    <mask id="starMask">
                        <polygon points="50,5 64,36 98,36 70,57 81,91 50,70 19,91 30,57 2,36 36,36" fill="white" />
                    </mask>
                </defs>
                <circle cx="50" cy="50" r="48" fill="#14171f" stroke="#ffffff" stroke-width="2"/>
                <g mask="url(#starMask)">
                    <rect x="0" y="0" width="33.3" height="100" fill="#CE1126" />
                    <rect x="33.3" y="0" width="33.4" height="100" fill="#FCD116" />
                    <rect x="66.7" y="0" width="33.3" height="100" fill="#009639" />
                </g>
                <text x="50" y="62" font-family="Arial Black" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">5</text>
            </svg>
            <div class="brand-title">
                <h1>STAR 5 TV</h1>
                <span>RÉPUBLIQUE DE GUINÉE</span>
            </div>
        </div>
        <div id="liveBadge" style="background:#222; font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; font-weight: bold;">
            EN ATTENTE
        </div>
    </header>

    <!-- ÉCRAN DE DIFFUSION -->
    <div class="tv-screen-box">
        <video id="rawVideo" playsinline webkit-playsinline muted autoplay></video>
        <canvas id="tvCanvas" width="1280" height="720"></canvas>
    </div>

    <!-- COMMANDES DE GESTION -->
    <div class="studio-panel">
        
        <!-- BOUTON PRIMORDIAL POUR LE TÉLÉPHONE -->
        <button id="startCamBtn" class="btn-main btn-start" onclick="demarrerCamera()">
            <i class="fas fa-power-off"></i> 1. ACTIVER MA CAMÉRA
        </button>

        <div id="regieControls" style="display: none; flex-direction: column; gap: 10px;">
            <input type="text" id="titreEmission" value="STAR 5 TV : DIRECT CONAKRY" placeholder="Titre du bandeau en direct...">

            <div class="btn-row">
                <button class="btn-main btn-cam" onclick="changerObjectif()">
                    <i class="fas fa-sync-alt"></i> Tourner Caméra
                </button>
                <button class="btn-main btn-rec" id="recBtn" onclick="gererEnregistrement()">
                    <i class="fas fa-circle"></i> Enregistrer
                </button>
            </div>
        </div>
    </div>

    <!-- LISTE DES REPLAYS -->
    <h3 style="font-size: 0.9rem; margin-top: 15px; color: var(--gn-yellow);">Émissions Enregistrées</h3>
    <div class="replays-list" id="replaysList"></div>

    <script>
        const video = document.getElementById('rawVideo');
        const canvas = document.getElementById('tvCanvas');
        const ctx = canvas.getContext('2d');
        const titreInput = document.getElementById('titreEmission');
        const liveBadge = document.getElementById('liveBadge');

        let cameraStream = null;
        let modeCamera = 'user'; // 'user' = selfie, 'environment' = arrière
        let mediaRecorder = null;
        let recordedChunks = [];
        let enEnregistrement = false;

        // Message d'attente initial sur l'écran
        ctx.fillStyle = "#11141c";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 30px Arial";
        ctx.textAlign = "center";
        ctx.fillText("Touchez 'ACTIVER MA CAMÉRA' ci-dessous", canvas.width / 2, canvas.height / 2);

        // 1. ALLUMER LA CAMÉRA (ACTION TACTILE OBLIGATOIRE SUR MOBILE)
        async function demarrerCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
            }

            try {
                // Demande caméra + micro
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: modeCamera },
                    audio: true
                });

                video.srcObject = cameraStream;
                
                // FORCE LE SMARTPHONE À LIRE LA VIDÉO
                await video.play();

                document.getElementById('startCamBtn').style.display = 'none';
                document.getElementById('regieControls').style.display = 'flex';
                liveBadge.style.background = "#CE1126";
                liveBadge.innerHTML = '<i class="fas fa-circle"></i> EN DIRECT';

                // Lancement de l'affichage en continu
                dessinerPlateauTV();

            } catch (err) {
                alert("Erreur d'accès : Assurez-vous d'avoir cliqué sur 'Autoriser' pour la caméra et le micro dans votre navigateur.");
                console.error(err);
            }
        }

        // 2. BASCULER ENTRE CAMÉRA AVANT ET ARRIÈRE
        function changerObjectif() {
            modeCamera = (modeCamera === 'user') ? 'environment' : 'user';
            demarrerCamera();
        }

        // 3. DESSINER LE LOGO DE GUINÉE ET LE BANDEAU SUR L'IMAGE
        function dessinerPlateauTV() {
            if (video.readyState >= 2) {
                // Afficher l'image de la caméra
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // --- LOGO GUINÉE EN HAUT À DROITE ---
                const lx = canvas.width - 150;
                const ly = 25;
                ctx.fillStyle = "rgba(0,0,0,0.6)";
                ctx.fillRect(lx - 10, ly - 5, 140, 45);

                // Barres Rouge - Jaune - Vert
                ctx.fillStyle = "#CE1126"; ctx.fillRect(lx, ly, 8, 35);
                ctx.fillStyle = "#FCD116"; ctx.fillRect(lx + 8, ly, 8, 35);
                ctx.fillStyle = "#009639"; ctx.fillRect(lx + 16, ly, 8, 35);

                ctx.fillStyle = "#FFFFFF";
                ctx.font = "bold 18px Arial";
                ctx.textAlign = "left";
                ctx.fillText("STAR 5", lx + 30, ly + 25);

                // --- BANDEAU D'INFORMATION EN BAS ---
                const by = canvas.height - 70;
                ctx.fillStyle = "#CE1126";
                ctx.fillRect(30, by, 140, 50);
                ctx.fillStyle = "#FFFFFF";
                ctx.font = "bold 16px Arial";
                ctx.fillText("DIRECT", 65, by + 32);

                ctx.fillStyle = "rgba(10, 12, 16, 0.9)";
                ctx.fillRect(170, by, canvas.width - 200, 50);
                ctx.fillStyle = "#FFFFFF";
                ctx.font = "20px Arial";
                ctx.fillText(titreInput.value, 190, by + 32);
            }
            requestAnimationFrame(dessinerPlateauTV);
        }

        // 4. SYSTÈME D'ENREGISTREMENT SUR LE TÉLÉPHONE
        function gererEnregistrement() {
            const btn = document.getElementById('recBtn');

            if (!enEnregistrement) {
                recordedChunks = [];
                const streamAEnregistrer = canvas.captureStream(30);

                if (cameraStream && cameraStream.getAudioTracks().length > 0) {
                    streamAEnregistrer.addTrack(cameraStream.getAudioTracks()[0]);
                }

                // Format supporté sur mobile
                let typeOptions = { mimeType: 'video/webm' };
                if (!MediaRecorder.isTypeSupported('video/webm')) {
                    typeOptions = { mimeType: 'video/mp4' };
                }

                mediaRecorder = new MediaRecorder(streamAEnregistrer, typeOptions);

                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/mp4' });
                    const urlVideo = URL.createObjectURL(blob);

                    // Téléchargement automatique sur le téléphone
                    const telechargement = document.createElement('a');
                    telechargement.href = urlVideo;
                    telechargement.download = `Star5TV_${Date.now()}.mp4`;
                    telechargement.click();

                    // Ajout dans la liste des Replays
                    const replays = document.getElementById('replaysList');
                    const div = document.createElement('div');
                    div.className = 'replay-item';
                    div.innerHTML = `
                        <div><strong>${titreInput.value}</strong><br><small style="color:#888">Enregistré</small></div>
                        <a href="${urlVideo}" target="_blank"><i class="fas fa-play"></i> Revoir</a>
                    `;
                    replays.prepend(div);
                };

                mediaRecorder.start();
                enEnregistrement = true;
                btn.innerHTML = '<i class="fas fa-stop"></i> Arrêter';
                btn.style.background = "#eab308";
            } else {
                mediaRecorder.stop();
                enEnregistrement = false;
                btn.innerHTML = '<i class="fas fa-circle"></i> Enregistrer';
                btn.style.background = "var(--gn-red)";
                alert("Votre émission est enregistrée et téléchargée sur votre téléphone !");
            }
        }
    </script>
</body>
</html>
