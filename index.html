<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Star 5 TV - Site Officiel & Régie Live</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --gn-red: #CE1126;
            --gn-yellow: #FCD116;
            --gn-green: #009639;
            --bg-main: #0b0d11;
            --bg-card: #151821;
            --text-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-color);
            padding-bottom: 30px;
        }

        /* HEADER AVEC LOGO GUINÉE */
        header {
            background: #11141c;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--gn-yellow);
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-title h1 {
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .brand-title span {
            font-size: 0.65rem;
            color: var(--gn-yellow);
            font-weight: bold;
        }

        /* ONGLETS (PUBLIC vs RÉGIE) */
        .tabs {
            display: flex;
            background: #1c202b;
            margin: 10px 15px;
            border-radius: 8px;
            overflow: hidden;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: transparent;
            border: none;
            color: #8b92a5;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--gn-red);
            color: white;
        }

        .content-section {
            display: none;
            padding: 0 15px;
        }

        .content-section.active {
            display: block;
        }

        /* ÉCRAN TÉLÉVISION / LECTEUR */
        .tv-screen {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: black;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #292e3d;
        }

        .tv-screen canvas, .tv-screen video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* PANNEAU DE CONTRÔLE RÉGIE (POUR VOUS) */
        .studio-panel {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .btn-cam { background: #3a4153; color: white; }
        .btn-rec { background: var(--gn-red); color: white; }
        .btn-stop { background: #6b7280; color: white; }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #0b0d11;
            border: 1px solid #33394a;
            color: white;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        /* SECTION REPLAY & ENREGISTREMENTS */
        .replays-list {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .replay-item {
            background: var(--bg-card);
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--gn-green);
        }

        .replay-item a {
            color: var(--gn-yellow);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- ENTÊTE AVEC LOGO STAR 5 TV -->
    <header>
        <div class="brand-box">
            <!-- Logo Étoile Drapeau Guinée SVG -->
            <svg width="40" height="40" viewBox="0 0 100 100">
                <defs>
                    <mask id="starMask">
                        <polygon points="50,5 64,36 98,36 70,57 81,91 50,70 19,91 30,57 2,36 36,36" fill="white" />
                    </mask>
                </defs>
                <circle cx="50" cy="50" r="48" fill="#14171f" stroke="#ffffff" stroke-width="2"/>
                <g mask="url(#starMask)">
                    <rect x="0" y="0" width="33.3" height="100" fill="#CE1126" />
                    <rect x="33.3" y="0" width="33.4" height="100" fill="#FCD116" />
                    <rect x="66.7" y="0" width="33.3" height="100" fill="#009639" />
                </g>
                <text x="50" y="62" font-family="Arial Black" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">5</text>
            </svg>
            <div class="brand-title">
                <h1>STAR 5 TV</h1>
                <span>RÉPUBLIQUE DE GUINÉE</span>
            </div>
        </div>
        <div style="font-size: 0.75rem; background: #232836; padding: 5px 8px; border-radius: 4px;">
            <i class="fas fa-signal" style="color:var(--gn-green)"></i> Connecté
        </div>
    </header>

    <!-- BOUTONS DE NAVIGATION INTERNE -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('direct')"><i class="fas fa-tv"></i> Télévision</button>
        <button class="tab-btn" onclick="switchTab('regie')"><i class="fas fa-video"></i> Ma Régie / Enregistrer</button>
    </div>

    <!-- 1. VUE DU PUBLIC (L'ÉCRAN DE LA CHAÎNE) -->
    <div id="section-direct" class="content-section active">
        <div class="tv-screen">
            <!-- L'écran où vos téléspectateurs regardent -->
            <canvas id="publicScreen" width="1280" height="720"></canvas>
        </div>
        <div style="padding: 12px 0;">
            <h2 style="font-size: 1.1rem;">Star 5 TV - En Continu</h2>
            <p style="color:#94a3b8; font-size: 0.8rem; margin-top: 4px;">Édition Conakry • Actualités, Société & Débats</p>
        </div>

        <h3 style="font-size: 0.9rem; margin-top: 15px; color: var(--gn-yellow);">Émissions Enregistrées (Replays)</h3>
        <div class="replays-list" id="replaysList">
            <div class="replay-item">
                <div>
                    <strong>Émission Spéciale N°1</strong><br>
                    <small style="color:#94a3b8">Enregistrée sur le téléphone</small>
                </div>
                <span style="color:var(--gn-green); font-size: 0.8rem;"><i class="fas fa-check-circle"></i> Disponible</span>
            </div>
        </div>
    </div>

    <!-- 2. VUE RÉGIE (POUR VOUS FILMER ET ENREGISTRER) -->
    <div id="section-regie" class="content-section">
        <div class="tv-screen">
            <!-- Retour régie en direct -->
            <video id="cameraRaw" autoplay playsinline muted style="display:none;"></video>
            <canvas id="studioMonitor" width="1280" height="720"></canvas>
        </div>

        <div class="studio-panel">
            <label style="font-size: 0.8rem; font-weight: bold; color: var(--gn-yellow);">Bandeau d'information de l'émission :</label>
            <input type="text" id="titreEmission" value="STAR 5 TV : DIRECT SPÉCIAL" placeholder="Tapez le titre qui s'affiche à l'écran...">

            <div class="controls-grid">
                <button class="btn btn-cam" onclick="changerCamera()">
                    <i class="fas fa-camera-rotate"></i> Tourner Caméra
                </button>
                <button class="btn btn-rec" id="recordButton" onclick="actionEnregistrement()">
                    <i class="fas fa-circle"></i> Enregistrer
                </button>
            </div>
            <p id="recTimer" style="text-align: center; font-size: 0.85rem; color: #ef4444; font-weight: bold; display: none;">
                🔴 ENREGISTREMENT EN COURS (Sauvegarde automatique sur votre téléphone)
            </p>
        </div>
    </div>

    <script>
        // NAVIGATION
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
            if(tab === 'direct') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('section-direct').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('section-regie').classList.add('active');
                allumerCamera();
            }
        }

        // MOTEUR VIDÉO & RÉGIE
        const video = document.getElementById('cameraRaw');
        const studioMonitor = document.getElementById('studioMonitor');
        const publicScreen = document.getElementById('publicScreen');
        const ctxStudio = studioMonitor.getContext('2d');
        const ctxPublic = publicScreen.getContext('2d');
        const titreInput = document.getElementById('titreEmission');

        let streamActif = null;
        let modeCamera = 'user'; // 'user' = avant, 'environment' = arrière
        let mediaRecorder = null;
        let recordedChunks = [];
        let enTrainEnregistrer = false;

        async function allumerCamera() {
            if(streamActif) {
                streamActif.getTracks().forEach(t => t.stop());
            }
            try {
                streamActif = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: modeCamera, width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: true
                });
                video.srcObject = streamActif;
            } catch (err) {
                console.log("Caméra en attente d'autorisation...");
            }
        }

        function changerCamera() {
            modeCamera = (modeCamera === 'user') ? 'environment' : 'user';
            allumerCamera();
        }

        // DESSIN DU FLUX AVEC LE LOGO GUINÉE ET LE BANDEAU
        function animerStudio() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // 1. Dessiner la caméra
                ctxStudio.drawImage(video, 0, 0, studioMonitor.width, studioMonitor.height);

                // 2. LOGO STAR 5 TV (Drapeau Guinée)
                const lx = studioMonitor.width - 150;
                const ly = 25;
                ctxStudio.fillStyle = "rgba(0,0,0,0.6)";
                ctxStudio.fillRect(lx - 10, ly - 5, 135, 45);

                ctxStudio.fillStyle = "#CE1126"; ctxStudio.fillRect(lx, ly, 8, 35);
                ctxStudio.fillStyle = "#FCD116"; ctxStudio.fillRect(lx+8, ly, 8, 35);
                ctxStudio.fillStyle = "#009639"; ctxStudio.fillRect(lx+16, ly, 8, 35);

                ctxStudio.fillStyle = "#FFFFFF";
                ctxStudio.font = "bold 18px Arial";
                ctxStudio.fillText("STAR 5", lx + 30, ly + 25);

                // 3. BANDEAU DE TITRE
                const by = studioMonitor.height - 70;
                ctxStudio.fillStyle = "#CE1126";
                ctxStudio.fillRect(30, by, 140, 50);
                ctxStudio.fillStyle = "#FFFFFF";
                ctxStudio.font = "bold 16px Arial";
                ctxStudio.fillText("DIRECT", 65, by + 32);

                ctxStudio.fillStyle = "rgba(10, 12, 16, 0.9)";
                ctxStudio.fillRect(170, by, studioMonitor.width - 200, 50);
                ctxStudio.fillStyle = "#FFFFFF";
                ctxStudio.font = "20px Arial";
                ctxStudio.fillText(titreInput.value, 190, by + 32);

                // Dupliquer vers l'écran public de la télévision
                ctxPublic.drawImage(studioMonitor, 0, 0, publicScreen.width, publicScreen.height);
            }
            requestAnimationFrame(animerStudio);
        }
        animerStudio();

        // SYSTÈME D'ENREGISTREMENT DE L'ÉMISSION
        function actionEnregistrement() {
            const btn = document.getElementById('recordButton');
            const timer = document.getElementById('recTimer');

            if (!enTrainEnregistrer) {
                // Débuter l'enregistrement
                recordedChunks = [];
                const streamToRecord = studioMonitor.captureStream(30);
                
                // Ajouter le micro
                if(streamActif && streamActif.getAudioTracks().length > 0) {
                    streamToRecord.addTrack(streamActif.getAudioTracks()[0]);
                }

                mediaRecorder = new MediaRecorder(streamToRecord, { mimeType: 'video/webm' });

                mediaRecorder.ondataavailable = function(e) {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = function() {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    
                    // Télécharger automatiquement la vidéo enregistrée dans le téléphone
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `Star5TV_Emission_${Date.now()}.webm`;
                    a.click();

                    // Ajouter à la liste des replays sur le site
                    const replaysList = document.getElementById('replaysList');
                    const newItem = document.createElement('div');
                    newItem.className = 'replay-item';
                    newItem.innerHTML = `
                        <div><strong>${titreInput.value}</strong><br><small style="color:#94a3b8">Enregistrée à l'instant</small></div>
                        <a href="${url}" target="_blank"><i class="fas fa-play"></i> Revoir</a>
                    `;
                    replaysList.prepend(newItem);
                };

                mediaRecorder.start();
                enTrainEnregistrer = true;
                btn.innerHTML = '<i class="fas fa-stop"></i> Arrêter & Sauvegarder';
                btn.style.background = "#eab308";
                timer.style.display = "block";
            } else {
                // Arrêter et sauvegarder la vidéo
                mediaRecorder.stop();
                enTrainEnregistrer = false;
                btn.innerHTML = '<i class="fas fa-circle"></i> Enregistrer';
                btn.style.background = "var(--gn-red)";
                timer.style.display = "none";
                alert("Votre émission a été enregistrée avec succès dans votre téléphone et ajoutée aux replays !");
            }
        }
    </script>
</body>
  </html>
