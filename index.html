<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Star 5 TV - Régie & Diffusion Réseaux</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --gn-red: #CE1126;
            --gn-yellow: #FCD116;
            --gn-green: #009639;
            --bg-main: #0b0d11;
            --bg-card: #151821;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: #ffffff;
            padding: 10px;
        }

        header {
            background: #11141c;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--gn-yellow);
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-title h1 {
            font-size: 1.1rem;
            font-weight: 900;
        }

        .brand-title span {
            font-size: 0.65rem;
            color: var(--gn-yellow);
            font-weight: bold;
        }

        .tv-screen-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #232733;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        video { display: none; }

        .studio-panel {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 15px;
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-main {
            padding: 13px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            color: white;
            text-decoration: none;
        }

        .btn-start { background: var(--gn-green); }
        .btn-cam { background: #3b82f6; }
        .btn-rec { background: var(--gn-red); }
        .btn-fb { background: #1877f2; }
        .btn-alert { background: #eab308; color: black; }
        .btn-photo { background: #8b5cf6; }

        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #0b0d11;
            border: 1px solid #33394a;
            color: white;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .section-title {
            font-size: 0.8rem;
            color: var(--gn-yellow);
            font-weight: bold;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- ENTÊTE AVEC LE LOGO GUINÉE -->
    <header>
        <div class="brand-box">
            <svg width="35" height="35" viewBox="0 0 100 100">
                <defs>
                    <mask id="starMask">
                        <polygon points="50,5 64,36 98,36 70,57 81,91 50,70 19,91 30,57 2,36 36,36" fill="white" />
                    </mask>
                </defs>
                <circle cx="50" cy="50" r="48" fill="#14171f" stroke="#ffffff" stroke-width="2"/>
                <g mask="url(#starMask)">
                    <rect x="0" y="0" width="33.3" height="100" fill="#CE1126" />
                    <rect x="33.3" y="0" width="33.4" height="100" fill="#FCD116" />
                    <rect x="66.7" y="0" width="33.3" height="100" fill="#009639" />
                </g>
                <text x="50" y="62" font-family="Arial Black" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">5</text>
            </svg>
            <div class="brand-title">
                <h1>STAR 5 TV</h1>
                <span>RÉPUBLIQUE DE GUINÉE</span>
            </div>
        </div>
        <div id="liveBadge" style="background:#222; font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; font-weight: bold;">
            EN ATTENTE
        </div>
    </header>

    <!-- ÉCRAN PLATEAU DE DIFFUSION -->
    <div class="tv-screen-box">
        <video id="rawVideo" playsinline webkit-playsinline muted autoplay></video>
        <canvas id="tvCanvas" width="1280" height="720"></canvas>
    </div>

    <!-- RÉGIE & DIFFUSION RÉSEAUX -->
    <div class="studio-panel">
        
        <button id="startCamBtn" class="btn-main btn-start" onclick="demarrerCamera()">
            <i class="fas fa-power-off"></i> 1. ACTIVER MA CAMÉRA
        </button>

        <div id="regieControls" style="display: none; flex-direction: column; gap: 10px;">
            <input type="text" id="titreEmission" value="STAR 5 TV : DIRECT SPÉCIAL" placeholder="Bandeau de l'émission...">

            <!-- CONTRÔLE CAMÉRA & ENREGISTREMENT -->
            <div class="btn-row">
                <button class="btn-main btn-cam" onclick="changerObjectif()">
                    <i class="fas fa-sync-alt"></i> Tourner
                </button>
                <button class="btn-main btn-rec" id="recBtn" onclick="gererEnregistrement()">
                    <i class="fas fa-circle"></i> Enregistrer
                </button>
            </div>

            <div class="section-title">
                <i class="fas fa-broadcast-tower"></i> Diffusion sur mes réseaux :
            </div>

            <!-- BOUTON 1 : ANNONCER LE DIRECT SUR WHATSAPP & GROUPES -->
            <button class="btn-main btn-alert" onclick="alerterReseauxEnDirect()">
                <i class="fas fa-bell"></i> Annoncer le direct sur mes réseaux
            </button>

            <!-- BOUTON 2 : DIFFUSER SUR FACEBOOK LIVE -->
            <div class="btn-row">
                <a href="https://www.facebook.com/live/create" target="_blank" class="btn-main btn-fb">
                    <i class="fab fa-facebook"></i> Facebook Live
                </a>
                <button class="btn-main btn-photo" onclick="partagerPhotoDirect()">
                    <i class="fas fa-camera"></i> Photo Réseaux
                </button>
            </div>

            <!-- BOUTON DE PARTAGE DE LA VIDÉO COMPLÈTE -->
            <button id="shareVideoBtn" class="btn-main btn-start" style="display: none;" onclick="partagerFichierVideo()">
                <i class="fab fa-whatsapp"></i> Partager la Vidéo Enregistrée
            </button>
        </div>
    </div>

    <script>
        const video = document.getElementById('rawVideo');
        const canvas = document.getElementById('tvCanvas');
        const ctx = canvas.getContext('2d');
        const titreInput = document.getElementById('titreEmission');
        const liveBadge = document.getElementById('liveBadge');
        const shareVideoBtn = document.getElementById('shareVideoBtn');

        let cameraStream = null;
        let modeCamera = 'user';
        let mediaRecorder = null;
        let recordedChunks = [];
        let enEnregistrement = false;
        let dernierFichierVideo = null;

        // Attente initiale
        ctx.fillStyle = "#11141c";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 30px Arial";
        ctx.textAlign = "center";
        ctx.fillText("Touchez 'ACTIVER MA CAMÉRA'", canvas.width / 2, canvas.height / 2);

        async function demarrerCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
            }

            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: modeCamera },
                    audio: true
                });

                video.srcObject = cameraStream;
                await video.play();

                document.getElementById('startCamBtn').style.display = 'none';
                document.getElementById('regieControls').style.display = 'flex';
                liveBadge.style.background = "#CE1126";
                liveBadge.innerHTML = '<i class="fas fa-circle"></i> EN DIRECT';

                dessinerPlateauTV();
            } catch (err) {
                alert("Erreur d'accès : " + err.message);
            }
        }

        function changerObjectif() {
            modeCamera = (modeCamera === 'user') ? 'environment' : 'user';
            demarrerCamera();
        }

        function dessinerPlateauTV() {
            if (video.readyState >= 2) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // LOGO GUINÉE
                const lx = canvas.width - 150;
                const ly = 25;
                ctx.fillStyle = "rgba(0,0,0,0.6)";
                ctx.fillRect(lx - 10, ly - 5, 140, 45);

                ctx.fillStyle = "#CE1126"; ctx.fillRect(lx, ly, 8, 35);
                ctx.fillStyle = "#FCD116"; ctx.fillRect(lx + 8, ly, 8, 35);
                ctx.fillStyle = "#009639"; ctx.fillRect(lx + 16, ly, 8, 35);

                ctx.fillStyle = "#FFFFFF";
                ctx.font = "bold 18px Arial";
                ctx.textAlign = "left";
                ctx.fillText("STAR 5", lx + 30, ly + 25);

                // BANDEAU DIRECT
                const by = canvas.height - 70;
                ctx.fillStyle = "#CE1126";
                ctx.fillRect(30, by, 140, 50);
                ctx.fillStyle = "#FFFFFF";
                ctx.font = "bold 16px Arial";
                ctx.fillText("DIRECT", 65, by + 32);

                ctx.fillStyle = "rgba(10, 12, 16, 0.9)";
                ctx.fillRect(170, by, canvas.width - 200, 50);
                ctx.fillStyle = "#FFFFFF";
                ctx.font = "20px Arial";
                ctx.fillText(titreInput.value, 190, by + 32);
            }
            requestAnimationFrame(dessinerPlateauTV);
        }

        // DIFFUSION DE L'ALERTE DIRECT SUR WHATSAPP & FACEBOOK
        async function alerterReseauxEnDirect() {
            const urlSite = window.location.href;
            const message = `🔴 *STAR 5 TV EST EN DIRECT !* 🇬🇳\n\n📺 *Émission :* ${titreInput.value}\n\n👉 Cliquez ici pour regarder le direct en direct sur notre site :\n${urlSite}`;

            if (navigator.share) {
                try {
                    await navigator.share({
                        title: "Star 5 TV en Direct",
                        text: message,
                        url: urlSite
                    });
                } catch (e) {}
            } else {
                navigator.clipboard.writeText(message);
                alert("Message d'alerte copié ! Collez-le dans vos groupes WhatsApp et Facebook.");
            }
        }

        // CAPTURE PHOTO DIRECT
        function partagerPhotoDirect() {
            canvas.toBlob(async blob => {
                const photoFile = new File([blob], `Star5TV_${Date.now()}.jpg`, { type: 'image/jpeg' });
                if (navigator.canShare && navigator.canShare({ files: [photoFile] })) {
                    try {
                        await navigator.share({
                            title: "Direct Star 5 TV",
                            text: `🔴 En ce moment sur Star 5 TV : ${titreInput.value}`,
                            files: [photoFile]
                        });
                    } catch (e) {}
                }
            }, 'image/jpeg', 0.9);
        }

        // GESTION ENREGISTREMENT & PARTAGE VIDÉO
        function gererEnregistrement() {
            const btn = document.getElementById('recBtn');

            if (!enEnregistrement) {
                recordedChunks = [];
                const stream = canvas.captureStream(30);
                if (cameraStream && cameraStream.getAudioTracks().length > 0) {
                    stream.addTrack(cameraStream.getAudioTracks()[0]);
                }

                let opts = { mimeType: 'video/webm' };
                if (!MediaRecorder.isTypeSupported('video/webm')) {
                    opts = { mimeType: 'video/mp4' };
                }

                mediaRecorder = new MediaRecorder(stream, opts);
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/mp4' });
                    dernierFichierVideo = new File([blob], `Star5TV_${Date.now()}.mp4`, { type: 'video/mp4' });

                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = dernierFichierVideo.name;
                    a.click();

                    shareVideoBtn.style.display = "block";
                };

                mediaRecorder.start();
                enEnregistrement = true;
                btn.innerHTML = '<i class="fas fa-stop"></i> Arrêter';
                btn.style.background = "#eab308";
            } else {
                mediaRecorder.stop();
                enEnregistrement = false;
                btn.innerHTML = '<i class="fas fa-circle"></i> Enregistrer';
                btn.style.background = "var(--gn-red)";
            }
        }

        async function partagerFichierVideo() {
            if (dernierFichierVideo && navigator.canShare && navigator.canShare({ files: [dernierFichierVideo] })) {
                try {
                    await navigator.share({
                        title: "Star 5 TV - Émission",
                        text: titreInput.value,
                        files: [dernierFichierVideo]
                    });
                } catch (e) {}
            }
        }
    </script>
</body>
</html>
