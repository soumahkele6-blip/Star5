<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Star 5 TV - Régie Mobile Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --gn-red: #CE1126;
            --gn-yellow: #FCD116;
            --gn-green: #009639;
            --bg-main: #0b0d11;
            --bg-card: #151821;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: #ffffff;
            padding: 10px;
        }

        /* HEADER AVEC LOGO GUINÉE */
        header {
            background: #11141c;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--gn-yellow);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-title h1 {
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .brand-title span {
            font-size: 0.65rem;
            color: var(--gn-yellow);
            font-weight: bold;
        }

        /* ÉCRAN TV PRINCIPAL */
        .tv-screen-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #232733;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        video { display: none; }

        /* PANNEAU DE CONTRÔLE RÉGIE */
        .studio-panel {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 12px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            color: white;
            text-align: center;
        }

        .btn-green { background: var(--gn-green); }
        .btn-blue  { background: #2563eb; }
        .btn-red   { background: var(--gn-red); }
        .btn-dark  { background: #374151; }
        .btn-share { background: #25D366; } /* Couleur WhatsApp */

        input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #0b0d11;
            border: 1px solid #33394a;
            color: white;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        /* REPLAYS ET FICHIERS */
        .replays-section {
            margin-top: 15px;
        }

        .replay-item {
            background: var(--bg-card);
            padding: 10px 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            border-left: 4px solid var(--gn-green);
        }

        .replay-item a {
            color: var(--gn-yellow);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <!-- ENTÊTE -->
    <header>
        <div class="brand-box">
            <svg width="35" height="35" viewBox="0 0 100 100">
                <defs>
                    <mask id="starMask">
                        <polygon points="50,5 64,36 98,36 70,57 81,91 50,70 19,91 30,57 2,36 36,36" fill="white" />
                    </mask>
                </defs>
                <circle cx="50" cy="50" r="48" fill="#14171f" stroke="#ffffff" stroke-width="2"/>
                <g mask="url(#starMask)">
                    <rect x="0" y="0" width="33.3" height="100" fill="#CE1126" />
                    <rect x="33.3" y="0" width="33.4" height="100" fill="#FCD116" />
                    <rect x="66.7" y="0" width="33.3" height="100" fill="#009639" />
                </g>
                <text x="50" y="62" font-family="Arial Black" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">5</text>
            </svg>
            <div class="brand-title">
                <h1>STAR 5 TV</h1>
                <span>RÉPUBLIQUE DE GUINÉE</span>
            </div>
        </div>
        <div id="liveBadge" style="background:#222; font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; font-weight: bold;">
            EN ATTENTE
        </div>
    </header>

    <!-- ÉCRAN PRINCIPAL DE DIFFUSION -->
    <div class="tv-screen-box">
        <video id="rawVideo" playsinline webkit-playsinline muted autoplay></video>
        <video id="fileVideo" playsinline webkit-playsinline loop style="display:none;"></video>
        <canvas id="tvCanvas" width="1280" height="720"></canvas>
    </div>

    <!-- PANNEAU RÉGIE -->
    <div class="studio-panel">

        <!-- BOUTON DÉMARRAGE -->
        <button id="startCamBtn" class="btn btn-green" onclick="demarrerCamera()">
            <i class="fas fa-power-off"></i> 1. ACTIVER LE DIRECT (CAMÉRA)
        </button>

        <!-- COMMANDES AVANCÉES -->
        <div id="controlsBox" style="display:none; flex-direction: column; gap: 10px;">
            <input type="text" id="titreEmission" value="STAR 5 TV : DIRECT SPÉCIAL" placeholder="Titre du bandeau TV...">

            <!-- LIGNE 1 : RÉGLAGE DE L'IMAGE ET TAILLE -->
            <div class="btn-grid">
                <button class="btn btn-dark" onclick="ajusterCadrage()">
                    <i class="fas fa-expand"></i> Cadrage : <span id="fitText" style="color:var(--gn-yellow)">Plein Écran</span>
                </button>
                <button class="btn btn-blue" onclick="changerCamera()">
                    <i class="fas fa-camera-rotate"></i> Tourner Caméra
                </button>
            </div>

            <!-- LIGNE 2 : ENREGISTREMENT ET FICHIER DU TÉLÉPHONE -->
            <div class="btn-grid">
                <button class="btn btn-red" id="recBtn" onclick="gererEnregistrement()">
                    <i class="fas fa-circle"></i> Enregistrer
                </button>

                <!-- BOUTON POUR PRENDRE UNE VIDÉO DANS LE TÉLÉPHONE -->
                <label class="btn btn-dark" style="margin:0;">
                    <i class="fas fa-folder-open"></i> Vidéo Téléphone
                    <input type="file" id="videoFileInput" accept="video/*" style="display:none;" onchange="chargerVideoLocale(event)">
                </label>
            </div>

            <!-- BOUTON DE PARTAGE MULTI-RÉSEAUX -->
            <button class="btn btn-share" onclick="partagerSurReseaux()">
                <i class="fas fa-share-nodes"></i> PARTAGER LE DIRECT (WhatsApp, Facebook...)
            </button>
        </div>
    </div>

    <!-- LISTE DES VIDÉOS & REPLAYS -->
    <div class="replays-section">
        <h3 style="font-size: 0.9rem; color: var(--gn-yellow); margin-bottom: 5px;">
            <i class="fas fa-film"></i> Replays et Enregistrements
        </h3>
        <div id="replaysList"></div>
    </div>

    <script>
        const video = document.getElementById('rawVideo');
        const fileVideo = document.getElementById('fileVideo');
        const canvas = document.getElementById('tvCanvas');
        const ctx = canvas.getContext('2d');
        const titreInput = document.getElementById('titreEmission');
        const liveBadge = document.getElementById('liveBadge');

        let cameraStream = null;
        let modeCamera = 'environment'; // Caméra arrière par défaut
        let sourceActive = 'camera'; // 'camera' ou 'fichier'
        let modeCadrage = 'cover';   // 'cover' (plein écran) ou 'contain' (bordures)
        let mediaRecorder = null;
        let recordedChunks = [];
        let enEnregistrement = false;

        // Écran de veille initial
        ctx.fillStyle = "#11141c";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 26px Arial";
        ctx.textAlign = "center";
        ctx.fillText("STAR 5 TV GUINÉE - PRÊT", canvas.width / 2, canvas.height / 2);

        // 1. ALLUMER LA CAMÉRA
        async function demarrerCamera() {
            sourceActive = 'camera';
            if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());

            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: modeCamera },
                    audio: true
                });
                video.srcObject = cameraStream;
                await video.play();

                document.getElementById('startCamBtn').style.display = 'none';
                document.getElementById('controlsBox').style.display = 'flex';
                liveBadge.style.background = "#CE1126";
                liveBadge.innerHTML = '<i class="fas fa-circle"></i> EN DIRECT';

                dessinerRegie();
            } catch (err) {
                alert("Autorisez l'accès à la caméra et au micro.");
            }
        }

        // 2. TOURNER LA CAMÉRA (AVANT / ARRIÈRE)
        function changerCamera() {
            modeCamera = (modeCamera === 'user') ? 'environment' : 'user';
            demarrerCamera();
        }

        // 3. AJUSTER L'IMAGE ET LE CADRAGE À L'ÉCRAN
        function ajusterCadrage() {
            modeCadrage = (modeCadrage === 'cover') ? 'contain' : 'cover';
            document.getElementById('fitText').innerText = (modeCadrage === 'cover') ? 'Plein Écran' : 'Format 16:9';
        }

        // 4. PRENDRE UNE VIDÉO / FICHIER DANS LE TÉLÉPHONE POUR LA DIFFUSER
        function chargerVideoLocale(event) {
            const fichier = event.target.files[0];
            if (fichier) {
                const url = URL.createObjectURL(fichier);
                fileVideo.src = url;
                fileVideo.play();
                sourceActive = 'fichier';
                liveBadge.innerHTML = '<i class="fas fa-film"></i> DIFFUSION FICHIER';
                liveBadge.style.background = "#2563eb";
            }
        }

        // 5. MOTEUR D'AFFICHAGE DU PLATEAU TV
        function dessinerRegie() {
            const sourceVideo = (sourceActive === 'camera') ? video : fileVideo;

            if (sourceVideo.readyState >= 2) {
                // Fond noir
                ctx.fillStyle = "#000000";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Gestion du Cadrage (Ajustement de l'image)
                if (modeCadrage === 'cover') {
                    // Plein écran ajusté sans bordures
                    const hRatio = canvas.width / sourceVideo.videoWidth;
                    const vRatio = canvas.height / sourceVideo.videoHeight;
                    const ratio = Math.max(hRatio, vRatio);
                    const centerShiftX = (canvas.width - sourceVideo.videoWidth * ratio) / 2;
                    const centerShiftY = (canvas.height - sourceVideo.videoHeight * ratio) / 2;
                    ctx.drawImage(sourceVideo, 0, 0, sourceVideo.videoWidth, sourceVideo.videoHeight,
                                  centerShiftX, centerShiftY, sourceVideo.videoWidth * ratio, sourceVideo.videoHeight * ratio);
                } else {
                    // Respect strict des proportions 16:9
                    ctx.drawImage(sourceVideo, 0, 0, canvas.width, canvas.height);
                }

                // --- LOGO GUINÉE EN HAUT À DROITE ---
                const lx = canvas.width - 150;
                const ly = 25;
                ctx.fillStyle = "rgba(0,0,0,0.65)";
                ctx.fillRect(lx - 10, ly - 5, 140, 45);

                // Drapeau de Guinée (Rouge, Jaune, Vert)
                ctx.fillStyle = "#CE1126"; ctx.fillRect(lx, ly, 8, 35);
                ctx.fillStyle = "#FCD116"; ctx.fillRect(lx + 8, ly, 8, 35);
                ctx.fillStyle = "#009639"; ctx.fillRect(lx + 16, ly, 8, 35);

                ctx.fillStyle = "#FFFFFF";
                ctx.font = "bold 18px Arial";
                ctx.textAlign = "left";
                ctx.fillText("STAR 5", lx + 30, ly + 25);

                // --- BANDEAU D'INFORMATION EN BAS ---
                const by = canvas.height - 70;
                ctx.fillStyle = "#CE1126";
                ctx.fillRect(30, by, 140, 50);
                ctx.fillStyle = "#FFFFFF";
                ctx.font = "bold 16px Arial";
                ctx.fillText("DIRECT", 65, by + 32);

                ctx.fillStyle = "rgba(10, 12, 16, 0.9)";
                ctx.fillRect(170, by, canvas.width - 200, 50);
                ctx.fillStyle = "#FFFFFF";
                ctx.font = "20px Arial";
                ctx.fillText(titreInput.value, 190, by + 32);
            }
            requestAnimationFrame(dessinerRegie);
        }

        // 6. ENREGISTREMENT DE L'ÉMISSION
        function gererEnregistrement() {
            const btn = document.getElementById('recBtn');

            if (!enEnregistrement) {
                recordedChunks = [];
                const stream = canvas.captureStream(30);

                if (cameraStream && cameraStream.getAudioTracks().length > 0) {
                    stream.addTrack(cameraStream.getAudioTracks()[0]);
                }

                let options = { mimeType: 'video/webm' };
                if (!MediaRecorder.isTypeSupported('video/webm')) {
                    options = { mimeType: 'video/mp4' };
                }

                mediaRecorder = new MediaRecorder(stream, options);
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/mp4' });
                    const videoUrl = URL.createObjectURL(blob);

                    // Téléchargement dans la mémoire du téléphone
                    const a = document.createElement('a');
                    a.href = videoUrl;
                    a.download = `Star5TV_${Date.now()}.mp4`;
                    a.click();

                    // Ajouter dans la liste pour revoir et partager
                    ajouterReplay(titreInput.value, videoUrl, blob);
                };

                mediaRecorder.start();
                enEnregistrement = true;
                btn.innerHTML = '<i class="fas fa-stop"></i> Arrêter';
                btn.style.background = "#eab308";
            } else {
                mediaRecorder.stop();
                enEnregistrement = false;
                btn.innerHTML = '<i class="fas fa-circle"></i> Enregistrer';
                btn.style.background = "var(--gn-red)";
            }
        }

        // 7. PARTAGER LE DIRECT SUR LES RÉSEAUX SOCIAUX
        function partagerSurReseaux() {
            const urlSite = window.location.href;
            const message = `🔴 Regardez le direct sur Star 5 TV Guinée : ${titreInput.value}\nLien : ${urlSite}`;

            if (navigator.share) {
                // Partage natif Android / iPhone (WhatsApp, Facebook, SMS...)
                navigator.share({
                    title: 'Star 5 TV Guinée',
                    text: message,
                    url: urlSite
                }).catch(() => {});
            } else {
                // Secours direct vers WhatsApp
                window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`, '_blank');
            }
        }

        // 8. GESTION DES REPLAYS ET PARTAGE DES FICHIERS ENREGISTRÉS
        function ajouterReplay(titre, url, blob) {
            const list = document.getElementById('replaysList');
            const item = document.createElement('div');
            item.className = 'replay-item';
            item.innerHTML = `
                <div>
                    <strong>${titre}</strong><br>
                    <small style="color:#888">Enregistré dans le téléphone</small>
                </div>
                <div>
                    <a href="${url}" target="_blank"><i class="fas fa-play"></i> Revoir</a>
                    <a href="#" onclick="partagerFichierVideo('${titre}', '${url}')" style="color:var(--gn-green); margin-left:12px;">
                        <i class="fas fa-share-nodes"></i> Partager
                    </a>
                </div>
            `;
            list.prepend(item);
        }

        function partagerFichierVideo(titre, url) {
            if (navigator.share) {
                navigator.share({
                    title: titre,
                    text: `Regardez cette émission enregistrée sur Star 5 TV Guinée !`,
                    url: url
                }).catch(() => {});
            } else {
                window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent('Regardez l\'émission Star 5 TV : ' + url)}`, '_blank');
            }
        }
    </script>
</body>
</html>
